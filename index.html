<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>早上上学 · Morning at School</title>
<style>
  :root{
    --bg:#f7fbff; --ink:#17324d; --muted:#5e7389; --card:#ffffff; --line:#d8e6f2;
    --accent:#2869ff; --accent2:#ffbf32; --good:#37a96b; --bad:#ef6a71; --shadow:0 12px 30px rgba(36,78,120,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#eaf6ff 0%,#f7fbff 34%,#fff8ef 100%);color:var(--ink);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  button{font:inherit}
  .app{min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
  .brand-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#ffe58b;font-size:25px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
  .header-right{display:flex;align-items:center;gap:10px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:6px;font-weight:800}
  .toggle{appearance:none;width:46px;height:26px;background:#c8d4df;border-radius:999px;position:relative;cursor:pointer;vertical-align:middle}
  .toggle:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:white;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:.18s}
  .toggle:checked{background:var(--accent)} .toggle:checked:after{left:23px}
  .main{width:min(100%,1000px);margin:0 auto;padding:20px 16px 28px;flex:1}
  .screen{display:none;animation:rise .3s ease}.screen.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px;text-align:center}
  .hero h1{margin:0;font-size:clamp(34px,8vw,66px);line-height:1.05;letter-spacing:-.03em}
  .hero-en{font-size:20px;font-weight:900;color:var(--accent);margin-top:4px}
  .hero p{margin:10px auto 0;max-width:650px;color:var(--muted);font-size:18px;font-weight:700}
  .map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .scene-card{border:2px solid var(--line);background:#fff;border-radius:22px;padding:18px;min-height:170px;text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.05);transition:.16s;position:relative;overflow:hidden}
  .scene-card:hover{transform:translateY(-2px);border-color:#b8cff4}.scene-card:active{transform:translateY(0)}
  .scene-no{position:absolute;right:12px;top:10px;border-radius:999px;background:#eef5ff;color:#3d6fa9;font-size:13px;font-weight:900;padding:4px 8px}
  .scene-icon{font-size:42px}.scene-title{font-size:27px;font-weight:900;margin-top:6px}.scene-sub{color:var(--muted);font-weight:800;margin-top:5px}
  .footer-tip{text-align:center;color:var(--muted);font-size:14px;font-weight:700;margin-top:14px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .back,.audio,.small-btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 14px;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.04)}
  .back{font-size:22px}.audio{font-size:20px;min-width:54px}.audio.speaking{outline:4px solid #dce8ff}
  .scene-heading{flex:1;min-width:200px}.scene-heading h2{margin:0;font-size:clamp(29px,6vw,44px)}.scene-heading p{margin:2px 0 0;color:var(--muted);font-weight:800}
  .game-card{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px}
  .prompt{text-align:center;margin-bottom:16px}.prompt-main{font-size:clamp(32px,7vw,52px);font-weight:950;letter-spacing:-.02em}.prompt-note{margin-top:6px;color:var(--muted);font-size:16px;font-weight:800;line-height:1.4}
  .helper{font-size:14px;color:#6a7c90;font-weight:800;margin-top:4px}
  .clock-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
  .clock{width:min(58vw,310px);aspect-ratio:1;margin:auto;border-radius:50%;background:#fff;border:12px solid #eaf1f8;box-shadow:inset 0 0 0 3px #cddce9,0 15px 35px rgba(55,85,110,.12);position:relative}
  .tick{position:absolute;left:50%;top:50%;transform-origin:0 0;width:43%;height:4px;background:#1a3450;border-radius:4px;transform:rotate(0deg)}
  .hand.hour{width:29%;height:9px;transform-origin:0 50%;margin-top:-4px}.hand.minute{width:37%;height:7px;transform-origin:0 50%;margin-top:-3px}
  .center-dot{position:absolute;left:50%;top:50%;width:16px;height:16px;background:#1a3450;border-radius:50%;transform:translate(-50%,-50%)}
  .clock-number{position:absolute;inset:8%;display:flex;justify-content:center;align-items:flex-start;font-size:17px;font-weight:950;color:#486176;pointer-events:none}
  .number{position:absolute;left:50%;top:50%;transform-origin:0 0}
  .digital{display:flex;justify-content:center;align-items:center;border:2px solid #d9e6f1;border-radius:22px;background:#f8fbff;padding:24px;font-size:clamp(40px,10vw,68px);font-weight:950;letter-spacing:.03em;min-height:150px}
  .options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.option{min-height:90px;border:2px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;font-weight:950;font-size:clamp(25px,5vw,36px);transition:.12s;box-shadow:0 6px 14px rgba(30,67,98,.06)}.option:hover{transform:translateY(-2px);border-color:#a9c5ea}.option:active{transform:scale(.98)}
  .choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.item-card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;min-height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;box-shadow:0 7px 15px rgba(0,0,0,.05);transition:.12s}.item-card:hover{border-color:#a7c7f4;transform:translateY(-2px)}.item-emoji{font-size:50px}.item-word{font-size:34px;font-weight:950}.item-hint{font-size:14px;color:var(--muted);font-weight:800;text-align:center}
  .dress-stage{background:linear-gradient(180deg,#e9f8ff,#fff7ef);border-radius:26px;min-height:280px;position:relative;display:flex;justify-content:center;align-items:flex-end;padding:18px;overflow:hidden;border:1px solid #e1e9ef}.person{font-size:145px;line-height:1}.wear-badges{position:absolute;left:14px;top:14px;display:flex;gap:7px;flex-wrap:wrap}.wear{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-weight:900}.wear.done{background:#eafff1;border-color:#9fdfb8;color:#268455}
  .bag{background:linear-gradient(180deg,#eff7ff,#fff);border:2px dashed #a9c5df;border-radius:24px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:175px;margin-bottom:14px}.bag-icon{font-size:92px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.08))}.bag-items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}.packed{padding:8px 12px;border-radius:999px;background:#eafff1;border:1px solid #a7dfbc;font-size:22px;font-weight:950}
  .walk-scene{position:relative;min-height:330px;border-radius:26px;overflow:hidden;background:linear-gradient(#bfe8ff 0 56%,#d7f3c6 56% 68%,#c8b59e 68% 100%);border:1px solid #c7dce7}.sun{position:absolute;right:20px;top:18px;font-size:48px}.cloud{position:absolute;font-size:45px;opacity:.9}.cloud.one{left:12%;top:30px}.cloud.two{left:52%;top:76px}.road{position:absolute;left:0;right:0;bottom:0;height:33%;background:#c5b49d;clip-path:polygon(21% 0,79% 0,100% 100%,0 100%)}.kid{position:absolute;bottom:54px;left:20%;font-size:84px}.review-object{position:absolute;cursor:pointer;user-select:none;transition:.12s}.review-object:hover{transform:scale(1.08)}.ro-1{right:14%;bottom:56px;font-size:57px}.ro-2{left:8%;bottom:82px;font-size:55px}.ro-3{left:38%;bottom:38px;font-size:55px}.ro-4{right:31%;bottom:74px;font-size:52px}.ro-5{right:7%;bottom:105px;font-size:53px}.review-bubble{position:absolute;top:14px;left:14px;right:14px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:22px;font-weight:950;text-align:center}
  .school-front{background:linear-gradient(#bfe8ff 0 62%,#d8efbf 62%);border-radius:26px;padding:24px;min-height:310px;position:relative;overflow:hidden;text-align:center}.school-building{margin:25px auto 0;width:min(78%,520px);background:#ffdca6;border:5px solid #d69c57;border-radius:18px;padding:18px;box-shadow:0 10px 25px rgba(0,0,0,.08)}.school-sign{font-size:28px;font-weight:950;background:#fff3d2;border:2px solid #e7be7a;border-radius:12px;display:inline-block;padding:8px 14px}.school-door{font-size:84px;margin-top:10px}.teacher-row{display:flex;justify-content:center;gap:28px;align-items:flex-end;margin-top:14px}.char{font-size:64px}.name-bubble{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:950;margin-top:6px}
  .quiz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.char-tile{min-height:155px;border:2px solid var(--line);border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.05);transition:.12s}.char-big{font-size:72px;font-weight:950;line-height:1}.char-tile small{margin-top:7px;color:#789; font-weight:900}.quiz-prompt{font-size:22px;font-weight:900;color:var(--muted);text-align:center;margin-bottom:14px}.quiz-progress{display:flex;gap:6px;justify-content:center;margin:0 0 16px}.dot{width:10px;height:10px;border-radius:50%;background:#d7e3ec}.dot.on{background:var(--accent)}
  .celebrate{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}.confetti{position:absolute;width:10px;height:16px;border-radius:4px;animation:fall 900ms ease-out forwards}.star-pop{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:90px;z-index:110;animation:pop 900ms ease forwards;pointer-events:none}.feedback{min-height:42px;text-align:center;padding-top:13px;font-weight:950}.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
  @keyframes fall{from{transform:translateY(-10vh) rotate(0);opacity:1}to{transform:translateY(95vh) rotate(500deg);opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}
  .shake{animation:shake .35s ease}.disabled{pointer-events:none;opacity:.65}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .result{text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:var(--shadow)}.result-stars{font-size:72px}.result h2{font-size:40px;margin:4px 0}.result p{color:var(--muted);font-size:18px;font-weight:800}
  .parent{position:absolute;left:-9999px}.parent-data{display:none}.helper-on .parent-data{display:block}
  @media(max-width:720px){
    header{padding:10px 12px}.brand span{display:none}.main{padding:14px 12px 24px}.map-grid{grid-template-columns:repeat(2,1fr)}.scene-card{min-height:150px}.clock-wrap{grid-template-columns:1fr}.clock{width:min(70vw,280px)}.options{grid-template-columns:1fr}.choice-grid{grid-template-columns:repeat(2,1fr)}.quiz-grid{grid-template-columns:repeat(2,1fr)}.game-card{padding:16px}.dress-stage{min-height:240px}.person{font-size:120px}.school-front{min-height:300px}.school-building{width:92%}
  }
  @media(max-width:430px){.map-grid{grid-template-columns:1fr}.choice-grid,.quiz-grid{grid-template-columns:1fr 1fr}.scene-card{min-height:135px}.item-word{font-size:29px}.item-card{min-height:118px}.pill{padding:6px 8px;font-size:13px;gap:4px}}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <div class="brand"><div class="brand-icon">🌞</div><span>早上上学</span></div>
  <div class="header-right">
    <div class="pill" aria-label="stars">⭐ <span id="starCount">0</span></div>
    <label class="pill" title="Show pinyin + English under each word"><span>Parent Helper</span> <input id="helperToggle" class="toggle" type="checkbox" aria-label="Parent Helper: show pinyin and English"></label>
  </div>
</header>

<main class="main">
  <section id="home" class="screen active">
    <div class="hero">
      <h1>早上上学</h1>
      <div class="hero-en">Morning at School</div>
      <p>Wake up, get dressed, pack the backpack, and walk to school!</p>
      <div class="helper">Tap 🔊 on any screen to hear the word. Tap a level below to start anywhere.</div>
    </div>
    <div class="map-grid" id="mapGrid"></div>
    <div class="footer-tip">⭐ Stars are just for fun this round — they won't be saved.</div>
  </section>

  <section id="scene" class="screen">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="Back">↩️</button>
      <div class="scene-heading"><h2 id="sceneTitle"></h2><p id="sceneSub"></p></div>
      <button class="audio" id="sceneAudio" aria-label="Repeat audio">🔊</button>
    </div>
    <div id="sceneBody"></div>
  </section>
</main>
<div id="celebrate" class="celebrate"></div>
</div>
<script>
(() => {
  'use strict';

  const T1 = {
    "作": {p:"zuò", en:"do / make"}, "业": {p:"yè", en:"work"}, "点": {p:"diǎn", en:"o'clock / dot"},
    "分": {p:"fēn", en:"minute / part"}, "半": {p:"bàn", en:"half"}, "找": {p:"zhǎo", en:"find"},
    "早上": {p:"zǎoshang", en:"morning"}, "书包": {p:"shūbāo", en:"backpack"}, "作业": {p:"zuòyè", en:"homework"},
    "校长": {p:"xiàozhǎng", en:"principal"}, "衣服": {p:"yīfu", en:"clothes"}, "袜子": {p:"wàzi", en:"socks"},
    "鞋子": {p:"xiézi", en:"shoes"}, "六点五十分": {p:"liù diǎn wǔshí fēn", en:"6:50"}
  };
  const T2 = {
    "你好": ["nǐ hǎo","hello"], "早上好":["zǎoshang hǎo","good morning"], "老师":["lǎoshī","teacher"], "上学":["shàngxué","go to school"], "小朋友":["xiǎopéngyou","child / friend"],
    "看":["kàn","look / see"],"飞":["fēi","fly"],"有":["yǒu","have"],"我":["wǒ","I / me"],"你":["nǐ","you"],"这个":["zhège","this"],"人":["rén","person"],"上":["shàng","up / on"],"下":["xià","down / under"],"不":["bù","not"],
    "耳朵":["ěrduo","ear"],"耳":["ěr","ear"],"眼睛":["yǎnjing","eye"],"目":["mù","eye"],"鼻子":["bízi","nose"],"嘴巴":["zuǐba","mouth"],"口":["kǒu","mouth"],"脚":["jiǎo","foot"],"足":["zú","foot"],"手":["shǒu","hand"],"牙":["yá","tooth"],"头":["tóu","head"],
    "大的":["dà de","big"],"大":["dà","big"],"小的":["xiǎo de","small"],"小":["xiǎo","small"],"多":["duō","many"],"少":["shǎo","few"],
    "红色":["hóngsè","red"],"黄色":["huángsè","yellow"],"蓝色":["lánsè","blue"],"圆形":["yuánxíng","circle"],"三角形":["sānjiǎoxíng","triangle"],
    "两只":["liǎng zhī","two (animals)",],"两个":["liǎng ge","two"],"一":["yī","one"],"二":["èr","two"],"三":["sān","three"],"四":["sì","four"],"五":["wǔ","five"],"六":["liù","six"],"七":["qī","seven"],"八":["bā","eight"],"九":["jiǔ","nine"],"十":["shí","ten"],"二十":["èrshí","twenty"],"三十":["sānshí","thirty"],"四十":["sìshí","forty"],"五十":["wǔshí","fifty"],"六十":["liùshí","sixty"],"七十":["qīshí","seventy"],"八十":["bāshí","eighty"],"九十":["jiǔshí","ninety"],"百":["bǎi","one hundred"],
    "山":["shān","mountain"],"土":["tǔ","earth"],"木":["mù","wood"],"水":["shuǐ","water"],"火":["huǒ","fire"],"田":["tián","field"],"日":["rì","sun / day"],"中":["zhōng","middle"],"月":["yuè","moon / month"],"雨":["yǔ","rain"],
    "小鸡":["xiǎojī","chick"],"牛":["niú","cow"],"羊":["yáng","sheep"],"虫":["chóng","bug"],"马":["mǎ","horse"],"鸟":["niǎo","bird"],"鱼":["yú","fish"],"兔":["tù","rabbit"],
    "女":["nǚ","girl / female"],"妈":["mā","mom"],"奶":["nǎi","milk / grandma in compounds"],"姐":["jiě","older sister"],"妹":["mèi","younger sister"],"父":["fù","father"],"爸":["bà","dad"],"爷":["yé","grandpa"]
  };

  const sceneMeta = [
    {id:'clock', icon:'⏰', zh:'起床 · 看时间', sub:'Wake up / Clock'},
    {id:'dress', icon:'👕', zh:'穿衣服', sub:'Get dressed'},
    {id:'bag', icon:'🎒', zh:'装书包', sub:'Pack the backpack'},
    {id:'walk', icon:'🌳', zh:'走路去学校', sub:'Walk to school'},
    {id:'greet', icon:'🏫', zh:'到校打招呼', sub:'Arrive & greet'},
    {id:'quiz', icon:'⭐', zh:'小测验', sub:'Quiz round'}
  ];

  const state = {
    scene:'home', stars:0, helper:false, clockRound:0, dressStep:0, packed:[], walkSeen:0, greetDone:false, quizRound:0, quizOrder:null,
    voices:[], zhVoice:null, currentSpeakText:'', currentAudioButton:null
  };

  const $ = sel => document.querySelector(sel);
  const app = $('#app');
  const mapGrid = $('#mapGrid');
  const starCount = $('#starCount');
  const helperToggle = $('#helperToggle');
  const sceneTitle = $('#sceneTitle');
  const sceneSub = $('#sceneSub');
  const sceneBody = $('#sceneBody');
  const sceneAudio = $('#sceneAudio');
  const backBtn = $('#backBtn');

  function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));}
  function helperHtml(word, data){
    if(!state.helper || !data) return '';
    const [p,en] = Array.isArray(data) ? data : [data.p,data.en];
    return `<div class="parent-data">${escapeHtml(p)} · ${escapeHtml(en)}</div>`;
  }
  function speak(text, button){
    state.currentSpeakText = text;
    state.currentAudioButton = button || null;
    if (button){ button.classList.add('speaking'); setTimeout(()=>button.classList.remove('speaking'),420); }
    if(!('speechSynthesis' in window)) return fallbackCue(text);
    const u = new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=.82; u.pitch=1.05;
    if(state.zhVoice) u.voice=state.zhVoice;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }
  function fallbackCue(text){
    // A friendly visual cue when the browser has no Chinese voice.
    const b = state.currentAudioButton; if(!b) return;
    b.textContent='🔊'; b.title='No Chinese voice found — use the pinyin helper';
    b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:500});
  }
  function findVoice(){
    if(!('speechSynthesis' in window)) return;
    state.voices = window.speechSynthesis.getVoices();
    state.zhVoice = state.voices.find(v => /^zh-CN$/i.test(v.lang)) || state.voices.find(v=>/^zh/i.test(v.lang)) || null;
    document.body.classList.toggle('no-zh-voice', !state.zhVoice);
  }
  if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged=findVoice; findVoice(); }

  function addStar(){
    state.stars++; starCount.textContent=state.stars;
    const pop=document.createElement('div'); pop.className='star-pop'; pop.textContent='⭐'; $('#celebrate').appendChild(pop);
    for(let i=0;i<20;i++){
      const c=document.createElement('div'); c.className='confetti'; c.textContent='';
      c.style.left=(35+Math.random()*30)+'%'; c.style.top=(32+Math.random()*12)+'%'; c.style.background=['#ff6b6b','#ffd44d','#5dc5ff','#64d890','#b28cff'][Math.floor(Math.random()*5)];
      c.style.transform='rotate('+Math.random()*280+'deg)'; c.style.animationDelay=(Math.random()*120)+'ms'; $('#celebrate').appendChild(c);
    }
    setTimeout(()=>$('#celebrate').innerHTML='',1000);
    try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=').play().catch(()=>{}); }catch(e){}
  }
  function wrong(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function showScreen(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    const target = name==='home'?$('#home'):$('#scene'); target.classList.add('active');
  }

  function renderMap(){
    mapGrid.innerHTML = sceneMeta.map((s,i)=>`<button class="scene-card" data-scene="${s.id}" aria-label="${escapeHtml(s.sub)}: ${escapeHtml(s.zh)}"><span class="scene-no">${i+1}</span><div class="scene-icon">${s.icon}</div><div class="scene-title">${s.zh}</div><div class="scene-sub">${s.sub}</div></button>`).join('');
    mapGrid.querySelectorAll('.scene-card').forEach(b=>b.addEventListener('click',()=>openScene(b.dataset.scene)));
  }

  function setSceneHeader(meta){
    sceneTitle.textContent=meta.zh; sceneSub.textContent=meta.sub;
    sceneAudio.onclick=()=>speak(meta.zh,sceneAudio);
  }

  function openScene(id){
    state.scene=id; state.currentAudioButton=sceneAudio;
    const meta=sceneMeta.find(x=>x.id===id); setSceneHeader(meta); showScreen('scene');
    if(id==='clock') renderClock();
    if(id==='dress') renderDress();
    if(id==='bag') renderBag();
    if(id==='walk') renderWalk();
    if(id==='greet') renderGreet();
    if(id==='quiz'){ if(state.quizRound>=quizChars.length){state.quizRound=0; state.quizOrder=null;} renderQuiz(); }
  }
  backBtn.onclick=()=>{state.scene='home';showScreen('home');renderMap()};
  helperToggle.addEventListener('change',()=>{state.helper=helperToggle.checked; app.classList.toggle('helper-on',state.helper); if(state.scene!=='home') openScene(state.scene)});

  // --- Scene 1: clock ---
  const clockRounds=[
    {zh:'六点五十分',p:'liù diǎn wǔshí fēn',digital:'6:50',h:6,m:50,kind:'数字时间'},
    {zh:'两点半',p:'liǎng diǎn bàn',digital:'2:30',h:2,m:30,kind:'半点'},
    {zh:'六点半',p:'liù diǎn bàn',digital:'6:30',h:6,m:30,kind:'半点'}
  ];
  function clockSvg(h,m){
    const hourDeg=(h%12)*30+m*.5, minDeg=m*6;
    let nums=''; for(let n=1;n<=12;n++){ const ang=(n*30-90)*Math.PI/180; const r=39; const x=50+Math.cos(ang)*r, y=50+Math.sin(ang)*r; nums+=`<span class="number" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%)">${n}</span>`; }
    return `<div class="clock" aria-label="analog clock ${h}:${String(m).padStart(2,'0')}">${nums}<div class="hand hour tick" style="transform:rotate(${hourDeg-90}deg)"></div><div class="hand minute tick" style="transform:rotate(${minDeg-90}deg)"></div><div class="center-dot"></div></div>`;
  }
  function renderClock(){
    const r=clockRounds[state.clockRound%clockRounds.length];
    const choices=[r.digital, clockRounds[(state.clockRound+1)%3].digital, clockRounds[(state.clockRound+2)%3].digital].sort(()=>Math.random()-.5);
    sceneBody.innerHTML=`<div class="game-card"><div class="prompt"><div class="prompt-main">${r.zh}</div>${helperHtml(r.zh,{p:r.p,en:r.digital})}<div class="prompt-note">Listen, then tap the matching clock time.</div></div><div class="clock-wrap"><div>${clockSvg(r.h,r.m)}</div><div class="digital" id="digitalTarget">? : ?</div></div><div class="options">${choices.map(x=>`<button class="option" data-time="${x}">${x}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
    sceneAudio.onclick=()=>speak(r.zh,sceneAudio);
    sceneBody.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.time===r.digital){$('#digitalTarget').textContent=r.digital; addStar(); $('#feedback').textContent='Nice! Next one.'; $('#feedback').className='feedback good'; setTimeout(()=>{state.clockRound++;renderClock()},650)}
      else { wrong(b); $('#feedback').textContent='Not quite — tap 🔊 to listen again.'; $('#feedback').className='feedback bad'; speak(r.zh,sceneAudio); }
    }));
  }

  // --- Scene 2: dressing ---
  const dressOrder=[['衣服','👕',T1['衣服']],['袜子','🧦',T1['袜子']],['鞋子','👟',T1['鞋子']]];
  function renderDress(){
    const next=dressOrder[state.dressStep%3];
    const options=dressOrder.filter((_,i)=>i!==state.dressStep%3).concat([next]).sort(()=>Math.random()-.5);
    sceneBody.innerHTML=`<div class="game-card"><div class="prompt"><div class="prompt-main">${next[0]}</div>${helperHtml(next[0],next[2])}<div class="prompt-note">Get dressed in order — tap the next thing to put on: clothes → socks → shoes.</div></div><div class="dress-stage"><div class="wear-badges">${dressOrder.map((x,i)=>`<span class="wear ${i<state.dressStep?'done':''}">${x[1]} ${x[0]}</span>`).join('')}</div><div class="person">🧒</div></div><div class="choice-grid" style="margin-top:16px">${options.map(x=>`<button class="item-card" data-word="${x[0]}"><div class="item-emoji">${x[1]}</div><div class="item-word">${x[0]}</div>${helperHtml(x[0],x[2])}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
    sceneAudio.onclick=()=>speak(next[0],sceneAudio);
    sceneBody.querySelectorAll('.item-card').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.word===next[0]){ addStar(); state.dressStep++; $('#feedback').textContent=state.dressStep<3?'On it goes!':'All dressed!'; $('#feedback').className='feedback good'; if(state.dressStep<3) setTimeout(renderDress,550); else setTimeout(()=>showMiniResult('All Dressed!','Now let\'s pack the backpack 🎒'),650)}
      else wrong(b);
    }));
  }

  // --- Scene 3: backpack ---
  const bagItems=[['作业','📄',T1['作业']],['水','💧',T2['水']],['衣服','👕',T1['衣服']],['袜子','🧦',T1['袜子']],['鞋子','👟',T1['鞋子']]];
  const bagTargets=[['作业','zuòyè'],['衣服','yīfu'],['水','shuǐ']];
  function renderBag(){
    const target=bagTargets[state.packed.length%bagTargets.length];
    const options=bagItems.sort(()=>Math.random()-.5);
    sceneBody.innerHTML=`<div class="game-card"><div class="prompt"><div class="prompt-main">找 ${target[0]}</div>${helperHtml(target[0], T1[target[0]] || T2[target[0]] || ['shū','book'])}<div class="prompt-note">"找" means "find." Listen, then tap the right item to pack it.</div></div><div class="bag"><div class="bag-icon">🎒</div></div><div class="bag-items">${state.packed.map(w=>`<span class="packed">✓ ${w}</span>`).join('')}</div><div class="choice-grid" style="margin-top:16px">${options.map(x=>`<button class="item-card" data-word="${x[0]}"><div class="item-emoji">${x[1]}</div><div class="item-word">${x[0]}</div>${helperHtml(x[0],x[2])}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
    sceneAudio.onclick=()=>speak('找 '+target[0],sceneAudio);
    sceneBody.querySelectorAll('.item-card').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.word===target[0]){ addStar(); state.packed.push(target[0]); $('#feedback').textContent='Packed!'; $('#feedback').className='feedback good'; if(state.packed.length<3) setTimeout(renderBag,500); else setTimeout(()=>showMiniResult('Backpack Ready!','Now let\'s walk to school 🌳'),650)}
      else {wrong(b); speak('找 '+target[0],sceneAudio)}
    }));
  }

  // --- Scene 4: walk review ---
  const walkSet=[
    ['小鸡','🐥',T2['小鸡']],['牛','🐄',T2['牛']],['羊','🐑',T2['羊']],['鸟','🐦',T2['鸟']],['鱼','🐟',T2['鱼']],['兔','🐰',T2['兔']],
    ['红色','🔴',T2['红色']],['黄色','🟡',T2['黄色']],['蓝色','🔵',T2['蓝色']],['山','⛰️',T2['山']],['水','💧',T2['水']],['木','🪵',T2['木']],['圆形','⚪',T2['圆形']],['三角形','🔺',T2['三角形']]
  ].sort(()=>Math.random()-.5).slice(0,7);
  function renderWalk(){
    const target=walkSet[state.walkSeen%walkSet.length];
    sceneBody.innerHTML=`<div class="game-card"><div class="prompt"><div class="prompt-main">看！${target[0]}</div>${helperHtml(target[0],target[2])}<div class="prompt-note">"看" means "look!" Spot the matching word and tap it to keep walking.</div></div><div class="walk-scene"><div class="sun">☀️</div><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="road"></div><div class="kid">🧒🎒</div><div class="review-bubble">${target[0]}</div>
      <div class="review-object ro-1" data-word="${target[0]}">${target[1]}</div>
      <div class="review-object ro-2" data-word="${walkSet[(state.walkSeen+1)%walkSet.length][0]}">${walkSet[(state.walkSeen+1)%walkSet.length][1]}</div>
      <div class="review-object ro-3" data-word="${walkSet[(state.walkSeen+2)%walkSet.length][0]}">${walkSet[(state.walkSeen+2)%walkSet.length][1]}</div>
      <div class="review-object ro-4" data-word="${walkSet[(state.walkSeen+3)%walkSet.length][0]}">${walkSet[(state.walkSeen+3)%walkSet.length][1]}</div>
      <div class="review-object ro-5" data-word="${walkSet[(state.walkSeen+4)%walkSet.length][0]}">${walkSet[(state.walkSeen+4)%walkSet.length][1]}</div>
    </div><div class="feedback" id="feedback"></div></div>`;
    sceneAudio.onclick=()=>speak('看 '+target[0],sceneAudio);
    sceneBody.querySelectorAll('.review-object').forEach(el=>el.addEventListener('click',()=>{
      if(el.dataset.word===target[0]){addStar();state.walkSeen++;$('#feedback').textContent='Found it!';$('#feedback').className='feedback good';setTimeout(()=>{ if(state.walkSeen>=5) showMiniResult('Made It to School!','Next: say hello to the teacher 🏫'); else renderWalk()},600)}
      else wrong(el);
    }));
  }

  // --- Scene 5: greet ---
  function renderGreet(){
    const teacherPrompt=state.greetDone?'早上好！':'你好！';
    sceneBody.innerHTML=`<div class="game-card"><div class="prompt"><div class="prompt-main">${teacherPrompt}</div>${helperHtml(teacherPrompt,T2[teacherPrompt])}<div class="prompt-note">Tap each person to say hello. Then find the principal.</div></div><div class="school-front"><div class="school-building"><div class="school-sign">🏫 上学</div><div class="school-door">🚪</div></div><div class="teacher-row"><div><button class="item-card" id="teacherBtn" style="min-height:120px"><div class="char">🧑‍🏫</div><div class="name-bubble">老师</div>${helperHtml('老师',T2['老师'])}</button></div><div><button class="item-card" id="principalBtn" style="min-height:120px"><div class="char">🧑‍💼</div><div class="name-bubble">校长</div>${helperHtml('校长',T1['校长'])}</button></div></div></div><div class="feedback" id="feedback"></div></div>`;
    sceneAudio.onclick=()=>speak(teacherPrompt,sceneAudio);
    $('#teacherBtn').onclick=()=>{speak(teacherPrompt);addStar();state.greetDone=true;$('#feedback').textContent='Great greeting!';$('#feedback').className='feedback good';setTimeout(renderGreet,550)};
    $('#principalBtn').onclick=()=>{speak('校长');addStar();$('#feedback').textContent='Found the principal!';$('#feedback').className='feedback good';setTimeout(()=>showMiniResult('Great Job!','Last stop: the 6 quiz characters ⭐'),700)};
  }

  // --- Scene 6: quiz ---
  const quizChars=['作','业','点','分','半','找'];
  function shuffled(arr){ return arr.slice().sort(()=>Math.random()-.5); }
  function renderQuiz(){
    if(!state.quizOrder) state.quizOrder = shuffled(quizChars);
    const target=state.quizOrder[state.quizRound%quizChars.length];
    const options=shuffled(quizChars);
    sceneBody.innerHTML=`<div class="game-card"><div class="quiz-prompt">Listen to the sound, then tap the matching character.</div><div class="quiz-progress">${quizChars.map((_,i)=>`<span class="dot ${i<=state.quizRound?'on':''}"></span>`).join('')}</div><div class="prompt" style="margin-bottom:14px"><button class="audio" id="quizAudio" style="font-size:26px;padding:13px 22px">🔊 Listen again</button><div class="helper" style="margin-top:10px">${helperHtml(target,T1[target])}</div></div><div class="quiz-grid">${options.map(ch=>`<button class="char-tile" data-char="${ch}"><div class="char-big">${ch}</div>${helperHtml(ch,T1[ch])}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
    $('#quizAudio').onclick=()=>speak(target,$('#quizAudio'));
    setTimeout(()=>speak(target,$('#quizAudio')),80);
    sceneBody.querySelectorAll('.char-tile').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.char===target){addStar();$('#feedback').textContent='Awesome!';$('#feedback').className='feedback good';setTimeout(()=>{state.quizRound++; if(state.quizRound<quizChars.length) renderQuiz(); else showFinal()},550)} else wrong(b);
    }));
  }
  function showMiniResult(title,msg){
    sceneBody.innerHTML=`<div class="result"><div class="result-stars">⭐</div><h2>${title}</h2><p>${msg}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="small-btn" id="nextMap">🗺️ Level Map</button><button class="small-btn" id="nextScene">➡️ Next Level</button></div></div>`;
    $('#nextMap').onclick=()=>{state.scene='home';showScreen('home');renderMap()};
    $('#nextScene').onclick=()=>{const idx=sceneMeta.findIndex(x=>x.id===state.scene); openScene(sceneMeta[Math.min(idx+1,sceneMeta.length-1)].id)};
  }
  function showFinal(){
    sceneBody.innerHTML=`<div class="result"><div class="result-stars">⭐⭐⭐</div><h2>Quiz Complete!</h2><p>You found all 6 characters: 作 · 业 · 点 · 分 · 半 · 找</p><p style="font-size:30px;color:#d99700;font-weight:950">Stars this round: ${state.stars}</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="small-btn" id="homeDone">🏠 Back to Start</button><button class="small-btn" id="redoQuiz">🔁 Play Again</button></div></div>`;
    $('#homeDone').onclick=()=>{state.scene='home';showScreen('home');renderMap()};
    $('#redoQuiz').onclick=()=>{state.quizRound=0;state.quizOrder=null;openScene('quiz')};
  }

  renderMap();
})();
</script>
</body>
</html>
